name: Gerar versao de teste

on:
  pull_request:
    branches: [ "main", "dev" ]
    types:
      - labeled # Dispara quando uma label e adicionada ao PR
  workflow_dispatch:

jobs:
  test:
    name: Executar testes unitarios.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Conceder permissao de execucao para gradlew
        run: chmod +x gradlew

      - name: Criar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Executar Testes
        run: ./gradlew test --stacktrace

  build:
    name: Build do APK
    runs-on: ubuntu-latest

    # Condicao para executar apenas se a label for 'build apk test'
    if: ${{ github.event.label.name == 'build apk test' }}

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v2

      - name: Conceder permissao de execucao para gradlew
        run: chmod +x gradlew

      - name: Criar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Construir APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Fazer upload do APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk