name: CD - Gerar Versao de Teste (APK Debug)

on:
  pull_request:
    branches: [ "main", "dev" ]
    types:
      - labeled
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Gerar APK de Teste (Debug)
    runs-on: ubuntu-latest
    if: ${{ github.actor == github.repository_owner && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'build apk test') }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v7

      - name: Configurar JDK 17 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Conceder permissão ao gradlew
        run: chmod +x ./gradlew

      - name: Criar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Validar Testes Unitarios
        run: ./gradlew :core:domain:test testDebugUnitTest --stacktrace

      - name: Construir APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar Artefato APK Debug
        uses: actions/upload-artifact@v7
        with:
          name: vale-voip-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
