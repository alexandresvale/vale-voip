name: CI - Qualidade de PR (Lint, Testes Unitarios e Integrados)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-tests:
    name: Lint & Testes Unitários
    runs-on: ubuntu-latest
    if: ${{ github.actor == github.repository_owner }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v7

      - name: Configurar JDK 17 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Conceder permissão ao gradlew
        run: chmod +x ./gradlew

      - name: Criar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Executar Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Executar Testes Unitários (Dominio + Android)
        run: ./gradlew :core:domain:test testDebugUnitTest --stacktrace

      - name: Upload de Relatórios (Lint + Testes Unitarios)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/tests/**
          retention-days: 7

  instrumented-tests:
    name: Testes Integrados (Android Emulator)
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    if: ${{ github.actor == github.repository_owner }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v7

      - name: Configurar JDK 17 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Habilitar Permissões KVM no Runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Conceder permissao ao gradlew
        run: chmod +x ./gradlew

      - name: Criar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Executar Testes Integrados (Tink Keystore & Compose UI)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: ./gradlew :core:data:connectedDebugAndroidTest :feature:login:connectedDebugAndroidTest --stacktrace

      - name: Upload de Relatórios de Testes Integrados
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-test-reports
          path: '**/build/reports/androidTests/connected/**'
          retention-days: 7
