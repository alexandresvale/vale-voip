name: CD - Gerar Versão de Produção (Release APK & AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Gerar Build de Producao (Release + R8)
    runs-on: ubuntu-latest
    if: ${{ github.actor == github.repository_owner }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v7

      - name: Configurar JDK 17 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Conceder permissão ao gradlew
        run: chmod +x ./gradlew

      - name: Criar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Preparar Keystore de Producao (Opcional via Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.VALEVOIP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
            echo "VALEVOIP_KEYSTORE_FILE=$PWD/app/release-keystore.jks" >> $GITHUB_ENV
          fi

      - name: Validar Suite de Testes Unitarios
        run: ./gradlew :core:domain:test testDebugUnitTest --stacktrace

      - name: Construir APK e App Bundle de Produção (R8 Minified)
        env:
          VALEVOIP_KEYSTORE_PASSWORD: ${{ secrets.VALEVOIP_KEYSTORE_PASSWORD }}
          VALEVOIP_KEY_ALIAS: ${{ secrets.VALEVOIP_KEY_ALIAS }}
          VALEVOIP_KEY_PASSWORD: ${{ secrets.VALEVOIP_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Publicar Artefato APK Release
        uses: actions/upload-artifact@v7
        with:
          name: vale-voip-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publicar Artefato Android App Bundle (AAB Google Play)
        uses: actions/upload-artifact@v7
        with:
          name: vale-voip-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Publicar Mapping R8 (Símbolos de Desofuscação Crashlytics)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vale-voip-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
