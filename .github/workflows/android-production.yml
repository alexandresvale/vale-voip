name: CD - Gerar Versão de Produção (Release APK & AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Gerar Build de Produção (Release + R8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.actor == github.repository_owner }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v7

      - name: Setup do Ambiente Vale VoIP
        uses: ./.github/actions/setup-project
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Validar e Preparar Keystore de Produção
        env:
          KEYSTORE_BASE64: ${{ secrets.VALEVOIP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VALEVOIP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VALEVOIP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VALEVOIP_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secrets de assinatura de produção (VALEVOIP_KEYSTORE_*) estão ausentes. Abortando para evitar build de produção assinado com chave de debug."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          echo "VALEVOIP_KEYSTORE_FILE=$PWD/app/release-keystore.jks" >> $GITHUB_ENV

      - name: Validar Suite de Testes Unitários (Todos os Módulos)
        run: ./gradlew :core:domain:test testDebugUnitTest --continue --stacktrace

      - name: Construir APK e App Bundle de Produção (R8 Minified)
        env:
          VALEVOIP_KEYSTORE_PASSWORD: ${{ secrets.VALEVOIP_KEYSTORE_PASSWORD }}
          VALEVOIP_KEY_ALIAS: ${{ secrets.VALEVOIP_KEY_ALIAS }}
          VALEVOIP_KEY_PASSWORD: ${{ secrets.VALEVOIP_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Limpar Keystore Temporária do Disco
        if: always()
        run: rm -f app/release-keystore.jks

      - name: Publicar Artefato APK Release
        uses: actions/upload-artifact@v7
        with:
          name: vale-voip-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Artefato Android App Bundle (AAB Google Play)
        uses: actions/upload-artifact@v7
        with:
          name: vale-voip-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Mapping R8 (Símbolos de Desofuscação Crashlytics)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vale-voip-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90
